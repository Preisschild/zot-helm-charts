---
# yaml-language-server: $schema=https://raw.githubusercontent.com/helm-unittest/helm-unittest/main/schema/helm-testsuite.json
suite: test config

templates:
  - ./config.yaml

tests:
  - it: generate Secret with config.json if config is set
    set:
      config:
        storage:
          rootDirectory: /tmp/zot
        http:
          address: 127.0.0.1
          port: "80"
    asserts:
      - containsDocument:
          apiVersion: v1
          kind: Secret
      - equal:
          path: data["config.json"]
          decodeBase64: true
          value: |-
            {"http":{"address":"127.0.0.1","port":"80"},"storage":{"rootDirectory":"/tmp/zot"}}
